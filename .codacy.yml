---
# Codacy analyses application code only. Test code (e2e specs, unit tests)
# trips security rules meant for production paths (fixture reads, dynamic
# lookups, RegExp from known strings), and the SQL linters target SQL Server
# rather than SQLite migrations. Operator-run maintenance scripts take
# explicit local file arguments from a shell and never execute inside a
# request, so their argv-driven fs calls trip the same production rules.
# tsc, eslint and the test suites cover these.
exclude_paths:
  - "e2e/**"
  - "tests/**"
  - "prisma/migrations/**"
  # The project-status board bot (#501) runs only inside GitHub Actions. Its
  # flagged reads are of GITHUB_EVENT_PATH and GITHUB_STEP_SUMMARY, paths the
  # runner sets, and its one fetch() refuses any URL outside api.github.com
  # (main.mjs `call`, pinned by test/main.test.mjs). Its own tests are in
  # project-status-test.yml. logic.mjs stays analysed.
  - ".github/project-status/main.mjs"
  - ".github/project-status/test/**"
  # Only the argv-driven #380 maintenance scripts; the rest of scripts/
  # stays analysed. itemStageGuard.ts is listed because its whole job is to
  # realpath operator-supplied paths (Codacy's non-literal fs rule); its
  # behaviour is pinned by tests/unit/itemStageGuard.test.ts.
  - "scripts/itemStageGuard.ts"
  - "scripts/audit-item-merge.mjs"
  - "scripts/backfill-items.ts"
  - "scripts/backfill-item-documents.ts"
  - "scripts/verify-item-stage.ts"
