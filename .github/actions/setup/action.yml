name: Set up Hearth
description: Node 22 with the npm cache, `npm ci`, and the Prisma client.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Generate Prisma client
      shell: bash
      run: npx prisma generate
