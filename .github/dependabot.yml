# Security updates stay on (repo setting); this file adds weekly version
# updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Server and browser halves of WebAuthn always move together, majors
      # included: a /server-only bump is what broke main in #443. Listed
      # first so these never land in minor-and-patch on their own.
      # next-auth 5 beta still declares an optional peer on
      # @simplewebauthn/server ^9 (for its WebAuthn provider, which Hearth
      # doesn't use); the "$@simplewebauthn/*" overrides in package.json
      # point it at Hearth's own version, so neither side's bump trips npm ci
      # any more (#376). A major that changes the API fails typecheck and
      # e2e in its PR instead.
      simplewebauthn:
        patterns: ["@simplewebauthn/*"]
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
