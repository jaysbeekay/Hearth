name: CodeBot

on:
  issue_comment:
    types:
      - created

# The job checks nothing out and only reacts to the comment (issues: write
# covers comments on pull requests too), so nothing else is granted.
permissions:
  issues: write

concurrency:
  group: codebot-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  codebot:

    if: >
      startsWith(github.event.comment.body, '@codebot') &&
      github.event.comment.user.login == 'jaysbeekay' &&
      github.event.comment.author_association == 'OWNER'

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      # Fail before doing anything if the signing secret or the endpoint is
      # missing. Never sign with an empty key.
      - name: Check configuration
        env:
          CODEBOT_SECRET: ${{ secrets.CODEBOT_SECRET }}
          AI_WEBHOOK_URL: ${{ secrets.AI_WEBHOOK_URL }}
        run: |
          test -n "$CODEBOT_SECRET" || { echo "::error::CODEBOT_SECRET is not set."; exit 1; }
          test -n "$AI_WEBHOOK_URL" || { echo "::error::AI_WEBHOOK_URL is not set."; exit 1; }

      # Event values reach the shell through env, never as expressions inside
      # run:, so no comment or title text can be spliced into a command.
      - name: Log trigger
        env:
          LOGIN: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "Triggered by: $LOGIN"
          echo "Repo: $REPO"
          echo "Issue/PR: $NUMBER"

      # Acknowledge the request straight away with a 👀 reaction on the
      # @codebot comment. continue-on-error so a failed reaction can never
      # block the webhook send below.
      - name: React with eyes to the request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST \
            "repos/$REPO/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes

      - name: Build curated payload
        id: payload
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          # printf (not `> payload.json`) so no trailing newline is added —
          # the signing step must hash the exact bytes curl will send.
          # Shape mirrors GitHub's native issue_comment webhook payload
          # (nested repository.full_name / issue.number / issue.title /
          # issue.user.login / issue.pull_request / comment.body /
          # comment.user.login) because that's what the Hermes route's
          # prompt template and skills (pr-gatekeeper, qa-issue-review)
          # actually expect via {dot.notation}.
          printf '%s' "$(jq -c '{
            event_type: "codebot_trigger",
            repository: { full_name: .repository.full_name },
            issue: ( .issue
                     | {number, title, user: {login: .user.login}}
                     + (if has("pull_request") then {pull_request: .pull_request} else {} end) ),
            is_pull_request: (.issue | has("pull_request")),
            comment: {
              id: .comment.id,
              body: .comment.body,
              user: { login: .comment.user.login },
              html_url: .comment.html_url,
              author_association: .comment.author_association
            }
          }' "$GITHUB_EVENT_PATH")" > payload.json

          # Log the shape, not the content: the comment body and issue title
          # stay out of the Actions log.
          echo "Payload built: $(wc -c < payload.json) bytes, comment ${COMMENT_ID}"

      - name: Sign and send curated event to Hermes
        env:
          CODEBOT_SECRET: ${{ secrets.CODEBOT_SECRET }}
          AI_WEBHOOK_URL: ${{ secrets.AI_WEBHOOK_URL }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          # Fail closed: an empty key would still produce a valid-looking HMAC.
          test -n "$CODEBOT_SECRET" || { echo "::error::CODEBOT_SECRET is not set; not sending."; exit 1; }
          test -n "$AI_WEBHOOK_URL" || { echo "::error::AI_WEBHOOK_URL is not set; not sending."; exit 1; }

          # payload.json was written with printf (no trailing newline) so the
          # bytes we hash below are byte-for-byte identical to what curl sends.
          TIMESTAMP=$(date +%s)
          BODY=$(cat payload.json)
          SIGNATURE=$(printf '%s.%s' "$TIMESTAMP" "$BODY" \
            | openssl dgst -sha256 -hmac "$CODEBOT_SECRET" -r \
            | awk '{print $1}')

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --max-time 300 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature-V2: $SIGNATURE" \
            -H "X-Webhook-Timestamp: $TIMESTAMP" \
            -H "X-Request-ID: codebot-$COMMENT_ID" \
            --data-binary @payload.json \
            "$AI_WEBHOOK_URL"
