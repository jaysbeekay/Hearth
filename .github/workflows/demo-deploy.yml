name: Demo deploy

# Builds the public demo image (docker/demo/Dockerfile: a Hearth release plus
# the sample household from scripts/demo) and redeploys it to Fly.io and
# Render (#553). Neither host has a volume, so each deploy is also the reset:
# visitors' changes are gone and the seed's dates move to today.
#
# One-time setup, all in the repo's Settings (see docs/deployment/demo.md):
#   - secret FLY_API_TOKEN: turns on the Fly.io deploy. The app is created on
#     the first run if it doesn't exist.
#   - secret RENDER_DEPLOY_HOOK_URL: turns on the Render deploy (the service
#     is created once from docker/demo/render.yaml).
#   - secret DEMO_ADMIN_PASSWORD (optional): the maintainer login. Without it
#     the admin account is unusable, which is fine for a demo.
#   - variables FLY_DEMO_APP / FLY_ORG (optional): default hearth-demo / personal.
#   - variable DEMO_DEPLOY_AUTO = true: turns on the nightly and release
#     redeploys. Set it after a manual run has deployed and been checked.
# A host whose secret isn't set is skipped, so either can be set up first.

on:
  # Nightly reset, 00:30 UTC (02:30 in Johannesburg).
  schedule:
    - cron: "30 0 * * *"
  # Redeploy as soon as a release's image is published.
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build from (default: the latest release, or main if that release predates the demo files)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-deploy
  cancel-in-progress: false

env:
  DEMO_IMAGE: ghcr.io/jaysbeekay/hearth-demo

jobs:
  deploy:
    # Manual runs always go. The nightly and release triggers stay off until
    # the repo variable DEMO_DEPLOY_AUTO is "true", so the first deploy is a
    # watched manual run. A release redeploy needs a successful v* publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEMO_DEPLOY_AUTO == 'true' && (
        github.event_name == 'schedule' ||
        (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      # Build from a release so the demo shows what households run. The seed
      # must come from the same version as the image (same schema and
      # commands), so a release from before the demo files existed falls
      # back to building both from main.
      - name: Choose the version to build
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            REF=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          fi
          if [ -n "$REF" ] && [ "$REF" != "main" ] && git cat-file -e "$REF:docker/demo/Dockerfile" 2>/dev/null; then
            git checkout --quiet "$REF"
          else
            if [ -n "$REF" ] && [ "$REF" != "main" ]; then
              echo "::warning::$REF has no demo files yet; building the demo from main instead."
            fi
            REF=main
          fi
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "base=jaysbeekay/hearth:$REF" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building the demo from $REF ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"

      # Not a release: build the app image from the same source first.
      - name: Build the Hearth image from source
        if: steps.version.outputs.base == ''
        run: docker build -t hearth-app:local .

      - name: Build the demo image
        env:
          BASE: ${{ steps.version.outputs.base || 'hearth-app:local' }}
          TAG: ${{ steps.version.outputs.tag }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
        run: |
          docker build -f docker/demo/Dockerfile \
            --build-arg HEARTH_IMAGE="$BASE" \
            --secret id=demo_admin_password,env=DEMO_ADMIN_PASSWORD \
            -t "$DEMO_IMAGE:$TAG" -t "$DEMO_IMAGE:latest" .

      # Boot it once before anything is pushed: a broken image never reaches
      # either host.
      - name: Smoke-test the demo image
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker run -d --name demo -p 3000:3000 -e AUTH_SECRET="$(openssl rand -base64 32)" "$DEMO_IMAGE:$TAG"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health
          # A seeded database goes straight to the login page, not first-run setup.
          curl -fsS -o /dev/null -w "%{url_effective}\n" -L http://localhost:3000/ | tee /tmp/landing
          grep -q "/login" /tmp/landing
          docker rm -f demo

      - name: Push the demo image
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$DEMO_IMAGE:$TAG"
          docker push "$DEMO_IMAGE:latest"

      # A step's `if` can't read secrets, so record which hosts are set up.
      - name: Check which hosts are set up
        id: hosts
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "fly=${FLY_API_TOKEN:+true}" >> "$GITHUB_OUTPUT"
          echo "render=${RENDER_DEPLOY_HOOK_URL:+true}" >> "$GITHUB_OUTPUT"
          [ -n "$FLY_API_TOKEN" ] || echo "Fly.io skipped: no FLY_API_TOKEN secret" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$RENDER_DEPLOY_HOOK_URL" ] || echo "Render skipped: no RENDER_DEPLOY_HOOK_URL secret" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up flyctl
        if: steps.hosts.outputs.fly == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy to Fly.io
        if: steps.hosts.outputs.fly == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ vars.FLY_DEMO_APP || 'hearth-demo' }}
          ORG: ${{ vars.FLY_ORG || 'personal' }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! flyctl status --app "$APP" > /dev/null 2>&1; then
            flyctl apps create "$APP" --org "$ORG"
          fi
          # A fresh session secret each night: everyone is signed out at the
          # reset anyway, because the users are re-seeded.
          flyctl secrets set --app "$APP" --stage AUTH_SECRET="$(openssl rand -base64 32)"
          flyctl deploy --app "$APP" --config docker/demo/fly.toml \
            --image "$DEMO_IMAGE:$TAG" --env APP_URL="https://$APP.fly.dev" \
            --ha=false --strategy immediate --wait-timeout 5m
          echo "Fly.io: https://$APP.fly.dev" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Render
        if: steps.hosts.outputs.render == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # imgURL pins this night's image, so Render can't redeploy a cached
          # `latest`.
          IMG=$(printf '%s' "$DEMO_IMAGE:$TAG" | jq -sRr @uri)
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL&imgURL=$IMG" > /dev/null
          echo "Render: deploy of $DEMO_IMAGE:$TAG requested" >> "$GITHUB_STEP_SUMMARY"
