name: Docker image

# Builds the image on a PR that touches what goes into it, checks its size
# against a budget and runs the container smoke test (#518). Nothing is
# pushed. The same checks gate the release push in docker-publish.yml.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - docker/**
      - next.config.ts
      - package.json
      - package-lock.json
      - prisma/**
      - scripts/docker-*.sh
      # App code too: a new dynamic require or data file can fall outside the
      # standalone trace, which only the smoke test would catch.
      - src/**
      - public/**
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Compressed size of each architecture's image, in MiB. v0.20.1 was 697.9;
  # #518 brought amd64 to about 180. Raise this deliberately, in the PR that
  # needs it, and keep it in step with docker-publish.yml's.
  IMAGE_BUDGET_MIB: "200"

jobs:
  # Both published architectures (#478), each on a native runner, so an
  # Alpine package or native module missing for arm64 fails here rather than
  # in the release.
  build-and-smoke:
    name: build-and-smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            # buildx's default scope, shared with docker-publish.yml.
            cache: buildkit
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            cache: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: hearth:ci
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

      - name: Image size
        run: scripts/docker-image-size.sh hearth:ci "$IMAGE_BUDGET_MIB"

      # Upgrade path is checked against the newest published release, i.e.
      # the database a self-hoster pulling this change already has, if that
      # release has an image for this architecture.
      - name: Container smoke test
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          PREVIOUS="$(scripts/docker-previous-release.sh jaysbeekay/hearth:latest "$ARCH")"
          [ -n "$PREVIOUS" ] || echo "::notice::jaysbeekay/hearth:latest has no linux/$ARCH image; skipping the upgrade-path check."
          scripts/docker-smoke.sh hearth:ci ${PREVIOUS:+"$PREVIOUS"}
