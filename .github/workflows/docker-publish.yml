name: Publish Docker image

on:
  # Tag push only — a Docker Hub image is published for a release, not for
  # every commit that lands on main. This used to also trigger on push to
  # main, tagging that build `latest` via `enable={{is_default_branch}}`,
  # which tracks "newest commit on main" rather than "newest release": a
  # tag push (is_default_branch is false off a branch) never actually
  # produced `latest`, so self-hosters pulling `:latest` got whatever had
  # most recently merged, not what CHANGELOG.md says shipped.
  # workflow_dispatch stays for the documented manual-tag fallback in
  # README's "Releasing" section — always run it against the release tag.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    # Only publish from main or a release tag, never from an arbitrary branch
    # dispatched by hand.
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Tag runs use the `release` environment (Docker Hub secrets live there,
    # restricted to `v*` tags); other refs get none.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `latest` must follow the highest stable release, not whichever tag was
      # built last: re-running an old tag must not move it backwards.
      - name: Decide whether this tag is the newest release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          IS_LATEST=false
          if [[ "$REF" == refs/tags/v* && $REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            HIGHEST=$(gh api --paginate "repos/$REPO/tags" --jq '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            echo "this=$REF_NAME highest=$HIGHEST"
            [[ "$REF_NAME" == "$HIGHEST" ]] && IS_LATEST=true
          fi
          echo "is_latest=$IS_LATEST" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: jaysbeekay/hearth
          # `latest` only on a tag ref that is the highest stable release.
          tags: |
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest == 'true' }}
            type=ref,event=tag
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attach an SBOM and SLSA build provenance to the pushed image
          # (#160). Buildx generates and signs both as OCI attestations, so
          # anyone can see what went into a tag and which workflow run built
          # it — `docker buildx imagetools inspect jaysbeekay/hearth:latest`.
          # Native to buildx, so there's no extra tooling or key material for
          # a self-hoster to manage.
          sbom: true
          provenance: mode=max

      - name: Sync Docker Hub overview with README
        # Unconditional now: every run of this workflow is a release, so the
        # overview should refresh each time rather than only on a main push
        # (which no longer triggers this workflow at all).
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: jaysbeekay/hearth
          readme-filepath: ./README.md
          short-description: "Self-hosted household management: contracts, travel, home, and more"
