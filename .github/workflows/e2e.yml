name: E2E shakedown

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The app's document text-extraction pipeline (src/lib/documents/
      # textExtraction.ts) shells out to pdftotext/pdftoppm (poppler-utils)
      # and tesseract — installed in the production Dockerfile's image, but
      # this job runs `next dev` directly on the bare runner, not that
      # image, so it needs its own copy. Every failure mode in that
      # pipeline collapses to an empty string rather than throwing (by
      # design — extraction must never block saving a document), so a
      # missing binary here doesn't error, it just silently makes every
      # extraction-dependent e2e assertion see "" (see
      # 30-camera-inbox-review.spec.ts).
      - name: Install poppler-utils and tesseract-ocr
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Run e2e suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
