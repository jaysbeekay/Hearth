name: iOS check

# Compiles the iOS app for the simulator, unsigned, so a Swift error, or a
# Capacitor plugin that no longer builds after `cap sync`, fails a pull
# request instead of the next Xcode build on a Mac. It proves the code
# compiles and links; anything that needs signing still needs a signed
# build on a device.
#
# Not a required check (macOS runners are slower and scarcer), and
# path-filtered so it only runs on PRs that touch what feeds the iOS build.

on:
  pull_request:
    paths:
      - "ios/**"
      - "ios-shell/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for the simulator (unsigned)
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          build
