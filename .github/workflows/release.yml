name: Create GitHub Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0). Creates the vX.Y.Z tag if it doesn't exist yet. Run against main."
        required: true

permissions:
  contents: read

jobs:
  release:
    # Releases come from main (manual dispatch) or from a pushed v* tag.
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and validate tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo "::error::Run this workflow against main, not $REF."
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected x.y.z or x.y.z-suffix)."
            exit 1
          fi
          echo "name=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          NAME: ${{ steps.tag.outputs.name }}
        run: |
          NOTES=$(awk -v ver="[$VERSION]" '
            $0 ~ /^## \[/ { if (found) exit; if (index($0, ver)) { found=1; next } else next }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="_No changelog entry found for $NAME — see commits below._"
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: true

  # Builds the release's artifacts and waits for them, so a green release run
  # means the Docker image and the signed Android APK/AAB were actually
  # published, not just that a build was requested.
  #
  # A tag created by this workflow's own manual dispatch is made with the
  # GITHUB_TOKEN, and GitHub deliberately doesn't fire push-triggered
  # workflows for refs created by that token (why v0.19.2 never built), so on
  # a dispatch the tag builds are started here. When a human pushed the tag,
  # the push event already started them and this job only waits for them.
  # Separate job so only this one holds `actions: write`, not the job that
  # runs the release action.
  artifacts:
    needs: release
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Android ~10 min, Docker and iOS up to their own 45 min timeouts (they
    # run in parallel), plus queueing for a macOS runner.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Start or find the tag builds, and wait for them
        run: |
          set -uo pipefail
          workflows=(docker-publish.yml android-build.yml ios-testflight.yml)
          # A minute of slack for clock skew between this runner and the API.
          since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            event=workflow_dispatch
            for wf in "${workflows[@]}"; do
              gh workflow run "$wf" --ref "$TAG" || { echo "::error::Could not dispatch $wf for $TAG."; exit 1; }
            done
          else
            event=push
            # The push already started them; look back to the tag's push.
            since=$(date -u -d '-30 minutes' +%Y-%m-%dT%H:%M:%SZ)
          fi

          find_run() {
            gh run list --workflow "$1" --branch "$TAG" --event "$event" --limit 10 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$since\")] | sort_by(.createdAt) | last | .databaseId // empty"
          }

          failed=0
          echo "### Release artifacts for $TAG" >> "$GITHUB_STEP_SUMMARY"
          for wf in "${workflows[@]}"; do
            id=""
            for _ in $(seq 1 30); do
              id=$(find_run "$wf")
              [[ -n "$id" ]] && break
              sleep 10
            done
            if [[ -z "$id" ]]; then
              echo "::error::No $event run of $wf for $TAG appeared."
              echo "- $wf: no run found" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            url="https://github.com/$GH_REPO/actions/runs/$id"
            if gh run watch "$id" --exit-status --interval 30 > /dev/null; then
              echo "- $wf: success ($url)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$wf failed for $TAG: $url"
              echo "- $wf: **failed** ($url)" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"

      # A green build is not proof of publication: check the outputs exist.
      - name: Verify the APK/AAB are on the Release
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for name in app-release.apk app-release.aab; do
            if ! grep -qx "$name" <<< "$assets"; then
              echo "::error::$name is not attached to Release $TAG."
              exit 1
            fi
          done
          echo "- Release $TAG has app-release.apk and app-release.aab" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the Docker image is published
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect "jaysbeekay/hearth:$TAG" > /dev/null; then
            echo "::error::jaysbeekay/hearth:$TAG is not on Docker Hub."
            exit 1
          fi
          echo "- Docker Hub has jaysbeekay/hearth:$TAG" >> "$GITHUB_STEP_SUMMARY"
