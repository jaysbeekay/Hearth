# Snyk is a third-party action, governed by its own terms — see
# https://github.com/snyk/actions
#
# Every step here used to carry `continue-on-error: true`, which meant the
# workflow reported findings but could never fail: a high-severity dependency
# or container vulnerability merged without resistance (#160). The high-
# severity gates below now block. Reporting-only steps (`monitor`, IaC) stay
# non-blocking, since they upload state rather than assert anything.
#
# The whole job is skipped when SNYK_TOKEN isn't configured, so forks and
# clones aren't left with a permanently red, unfixable check.

name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    env:
      # Secrets can't be referenced in a job-level `if`, so this is checked per
      # step instead. Same pattern as HAS_SIGNING in android-build.yml.
      HAS_SNYK: ${{ secrets.SNYK_TOKEN != '' }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      IMAGE_TAG: hearth:snyk-scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Report that Snyk is not configured
        if: ${{ env.HAS_SNYK != 'true' }}
        run: |
          echo "SNYK_TOKEN is not set — skipping Snyk analysis." >> "$GITHUB_STEP_SUMMARY"
          echo "Add the secret to enable dependency, code and container scanning." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Snyk CLI
        if: ${{ env.HAS_SNYK == 'true' }}
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb # v0.4.0

      # ── Blocking gates ───────────────────────────────────────────────────
      # This app stores household financial and identity documents, so a known
      # high-severity hole shouldn't merge quietly.

      - name: Snyk Open Source test (blocks on high severity)
        if: ${{ env.HAS_SNYK == 'true' }}
        # --exclude covers the Open Source scan; the .snyk policy file covers
        # Code and IaC. Both are needed — they read exclusions from different
        # places. See .snyk for why android/ is out of scope.
        run: snyk test --all-projects --exclude=android --severity-threshold=high

      - name: Snyk Code test (blocks on high severity)
        if: ${{ env.HAS_SNYK == 'true' }}
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk Code results to GitHub Code Scanning
        # `always()` so findings still reach the Security tab on the runs where
        # the gate above failed — which is exactly when they're most wanted.
        if: ${{ always() && env.HAS_SNYK == 'true' && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: snyk-code.sarif

      - name: Build image for container scan
        if: ${{ env.HAS_SNYK == 'true' }}
        run: docker build -t "$IMAGE_TAG" .

      - name: Snyk Container test (blocks on high severity)
        if: ${{ env.HAS_SNYK == 'true' }}
        # --exclude-app-vulns splits the work between the two scans instead of
        # having both report the same thing: the Open Source step above already
        # covers this project's npm dependencies from the lockfile, so here the
        # container scan does what a container scan is for — the OS packages in
        # the image, base layers and the tesseract/poppler/su-exec this
        # Dockerfile installs.
        #
        # It also drops the npm CLI that ships inside node:22-alpine, which
        # currently carries 9 high-severity advisories (brace-expansion,
        # pacote, sigstore, picomatch, tar). Snyk classes that as an "image
        # application", not a base-image package, so --exclude-base-image-vulns
        # does not filter it. Nothing in this repository can fix them: they're
        # upstream's to patch and ours to pick up by moving the pinned digest.
        # Blocking every pull request on them would make the gate unactionable,
        # which is how gates get deleted. `snyk container monitor` below still
        # reports the whole image, unfiltered, to the dashboard — that's where
        # to look when choosing a new digest.
        run: >-
          snyk container test "$IMAGE_TAG" --file=Dockerfile
          --severity-threshold=high --exclude-app-vulns

      # ── Reporting only ───────────────────────────────────────────────────
      # These publish state to the Snyk dashboard rather than asserting
      # anything, so a transient failure shouldn't fail the build.

      - name: Snyk Open Source monitor
        if: ${{ env.HAS_SNYK == 'true' }}
        run: snyk monitor --all-projects --exclude=android
        continue-on-error: true

      - name: Snyk Container monitor
        if: ${{ env.HAS_SNYK == 'true' }}
        run: snyk container monitor "$IMAGE_TAG" --file=Dockerfile
        continue-on-error: true

      - name: Snyk IaC test and report
        if: ${{ env.HAS_SNYK == 'true' }}
        run: snyk iac test --report
        continue-on-error: true
