services:
  app:
    image: jaysbeekay/hearth:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:./data/app.db
      UPLOADS_DIR: ./data/uploads
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-}
      REMINDER_DEFAULT_DAYS: ${REMINDER_DEFAULT_DAYS:-30,14,7,1}
      REMINDER_CRON_SCHEDULE: ${REMINDER_CRON_SCHEDULE:-0 8 * * *}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Push notifications via ntfy.sh (or a self-hosted instance — see the
      # commented-out "ntfy" service below). Topics on the public ntfy.sh
      # instance are unauthenticated by default and guessable by anyone who
      # knows the name, so pick something long/unguessable (e.g.
      # "hearth-a1b2c3d4e5"), not something like "family-reminders". Set
      # NTFY_TOKEN if your topic is access-controlled.
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      # No default: a shared, guessable topic name on the public ntfy.sh
      # instance is world-readable, so anyone who guesses it receives this
      # household's reminders. Push stays off until you set one.
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      # Web Push needs no setup; optionally the contact push services see
      # ("mailto:..." or "https://..."). See .env.example.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      CRON_SECRET: ${CRON_SECRET:-}
      DISABLE_INTERNAL_SCHEDULER: ${DISABLE_INTERNAL_SCHEDULER:-}
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_TOKENS: ${MCP_TOKENS:-}
      MCP_IMPORT_LABELS: ${MCP_IMPORT_LABELS:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # Optional: route AI provider calls through a local agent-firewall proxy
      # (e.g. the commented-out "pipelock" service below) — see .env.example.
      AI_EGRESS_PROXY_URL: ${AI_EGRESS_PROXY_URL:-}
      AI_EGRESS_PROXY_CA_CERT: ${AI_EGRESS_PROXY_CA_CERT:-}
      BARCODE_LOOKUP_ENABLED: ${BARCODE_LOOKUP_ENABLED:-}
      BARCODE_LOOKUP_API_KEY: ${BARCODE_LOOKUP_API_KEY:-}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      MAP_TILE_SUBDOMAINS: ${MAP_TILE_SUBDOMAINS:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Optional gate on first-run setup — see .env.example.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-false}
      BACKUP_SFTP_HOST: ${BACKUP_SFTP_HOST:-}
      BACKUP_SFTP_PORT: ${BACKUP_SFTP_PORT:-22}
      BACKUP_SFTP_USERNAME: ${BACKUP_SFTP_USERNAME:-}
      BACKUP_SFTP_PASSWORD: ${BACKUP_SFTP_PASSWORD:-}
      BACKUP_SFTP_PRIVATE_KEY: ${BACKUP_SFTP_PRIVATE_KEY:-}
      BACKUP_SFTP_REMOTE_PATH: ${BACKUP_SFTP_REMOTE_PATH:-/backups}
      # Local backups land inside ./data, which is already mounted below —
      # no separate volume needed for this destination to be persisted.
      BACKUP_LOCAL_PATH: ${BACKUP_LOCAL_PATH:-}
    volumes:
      - ./data:/app/data
      # With the pipelock service below and TLS interception on, also mount
      # its CA certificate and set AI_EGRESS_PROXY_CA_CERT: /app/pipelock-ca.pem
      # - ./pipelock/ca.pem:/app/pipelock-ca.pem:ro
    restart: unless-stopped

  # Optional: self-host ntfy instead of relying on the public ntfy.sh
  # instance. Uncomment this service, set NTFY_URL: http://ntfy:80 above,
  # and subscribe to your topic in the ntfy app pointed at this server
  # instead of ntfy.sh.
  # ntfy:
  #   image: binwiederhier/ntfy
  #   command: serve
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./data/ntfy:/var/cache/ntfy
  #   restart: unless-stopped

  # Optional: run Pipelock (https://github.com/pipelab-org/pipelock), an
  # open-source agent firewall, in front of Hearth's outbound AI provider
  # traffic. Hearth uses it as a forward proxy. Set up ./pipelock first (see
  # README "Routing AI traffic through an agent firewall"), uncomment this
  # service and set AI_EGRESS_PROXY_URL: http://pipelock:8888 above.
  # pipelock:
  #   image: ghcr.io/luckypipewrench/pipelock:3.7.1@sha256:20402f0df5d2fb3ef50dadd8f70f758b49d878c3d90b2797eaadcb0f2f0c2ebd
  #   command: run --config /config/pipelock.yaml --listen 0.0.0.0:8888
  #   volumes:
  #     - ./pipelock:/config:ro
  #   restart: unless-stopped
