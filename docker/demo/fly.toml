# Fly.io config for the public demo (#553). Deployed by the "Demo deploy"
# workflow (.github/workflows/demo-deploy.yml), which passes the image and
# app name; see docs/deployment/demo.md.
#
# No volume on purpose: Fly resets a machine's root filesystem from the image
# each time it starts, so a stop on idle, a restart or the nightly redeploy
# all bring back the seeded household.
app = "hearth-demo"
primary_region = "jnb"

[env]
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  TZ = "Australia/Sydney"

[http_service]
  internal_port = 3000
  force_https = true
  # "stop", not "suspend": a suspended machine keeps its memory and files,
  # so visitors' changes would survive the idle period.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
