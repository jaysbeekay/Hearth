# Render Blueprint for the public demo (#553). Not the household Blueprint:
# that one is render.yaml at the repo root. Create it from Render's dashboard
# (New > Blueprint, Blueprint path docker/demo/render.yaml); see
# docs/deployment/demo.md.
#
# Free instance, no disk: it spins down after 15 minutes without traffic and
# comes back from the image, so idle time and the nightly redeploy both
# reset it to the seeded household.
services:
  - type: web
    name: hearth-demo
    runtime: image
    image:
      # Built and pushed nightly by .github/workflows/demo-deploy.yml, which
      # then calls this service's deploy hook to pull it again.
      url: ghcr.io/jaysbeekay/hearth-demo:latest
    plan: free
    # Closest Render region to South Africa. Can't be changed after creation.
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: TZ
        value: Australia/Sydney
      - key: AUTH_SECRET
        generateValue: true
